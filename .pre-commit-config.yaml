# Pre-commit configuration for Terraform/Terragrunt projects
# Install: pre-commit install -t pre-commit
# Install push scan: pre-commit install -t pre-push
# Manual full security scan: pre-commit run terraform_trivy terraform_checkov --all-files

minimum_pre_commit_version: "3.5.0"

repos:
  # Terraform/Terragrunt toolchain
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.108.0
    hooks:
      - id: terraform_fmt
        name: Terraform Format
        description: Auto format Terraform HCL
        stages: [pre-commit]

      - id: terraform_validate
        name: Terraform Validate Syntax
        description: Validate Terraform configuration syntax
        args:
          - --args=-no-color
        stages: [pre-commit]

      - id: terraform_tflint
        name: Terraform TFLint Lint
        description: Terraform static linter
        args:
          - --args=--init
        stages: [pre-commit]

      - id: terraform_checkov
        name: Checkov IaC Security Scan
        description: Block MEDIUM/HIGH/CRITICAL misconfigurations
        args:
          - --args=--quiet
          - --args=--severity=MEDIUM,HIGH,CRITICAL
        stages: [pre-push]

      - id: terraform_trivy
        name: Trivy IaC & Secret Scan
        description: Trivy scan, only block medium+ issues
        args:
          - --args=--quiet
          - --args=--scanners=config,secret
          - --args=--severity=MEDIUM,HIGH,CRITICAL
        stages: [pre-push]

  # Local Markdown lint with auto-fix
  - repo: local
    hooks:
      - id: markdownlint
        name: Markdown Lint
        entry: markdownlint --fix
        language: system
        types: [markdown]
        description: Auto fix markdown formatting
        stages: [pre-commit]

  # General file & secret checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        name: Detect Hardcoded Secrets
        stages: [pre-commit]

  - repo: https://github.com/opensource-nepal/commitlint
    rev: v1.0.0
    hooks:
      - id: commitlint
        stages: [commit-msg]

exclude: |
  (?x)^(
    .*/\.terraform/.*|
    .*/\.git/.*|
    .*/node_modules/.*|
    .*/vendor/.*|
    .*/\.idea/.*|
    .*/\.vscode/.*|
    .*\.tfstate$|
    .*\.tfstate\.backup$
  )$
