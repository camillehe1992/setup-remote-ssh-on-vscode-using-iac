; Update this inventory after Terraform creates the instance.
; Example:
;   ansible_host=<terraform output -raw instance_public_ip>
;   ansible_ssh_private_key_file=~/.ssh/aws-remote-ssh-on-vscode.pem

[aws_linux_remote_dev]
aws-linux-dev ansible_host=REPLACE_WITH_PUBLIC_IP ansible_user=ec2-user ansible_ssh_private_key_file=~/.ssh/aws-remote-ssh-on-vscode.pem
